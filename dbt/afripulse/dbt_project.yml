# =====================================================================
# AfriPulse dbt project
# Transforms raw (as-received) data into tested, documented marts:
#   staging       one model per source table: rename, cast, trim, convert units
#   intermediate  combine and conform sources
#   marts         star schema for Tableau (facts and dimensions)
# =====================================================================

name: afripulse
version: "0.5.0"
config-version: 2
profile: afripulse

model-paths: ["models"]
macro-paths: ["macros"]
# data/reference holds african_countries.csv (ADR 0001): one file, used by Python AND dbt.
seed-paths: ["seeds", "../../data/reference"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  un_wpp_projection_start_year: 2024   # F-UN-10: WPP 2024 estimates end in 2023
  sources_disagree_threshold_pp: 2     # F-IMF-9: flag sources differing by > 2 points
  date_spine_start: "2019-01-01"       # earliest synthetic signup date
  date_spine_end: "2026-12-31"

# Tableau's read-only role may use the marts schema (table SELECT grants are
# set per model below; schema USAGE is granted here, after every run).
on-run-end:
  - "{% for schema in schemas %}{% if schema in ['marts', 'reporting'] %}grant usage on schema {{ schema }} to afripulse_reader;{% endif %}{% endfor %}"

seeds:
  afripulse:
    +schema: reference
    african_countries:
      +column_types:
        iso2: text                      # keep Namibia's "NA" as text (F-UN-3)
        latitude: numeric
        longitude: numeric
    indicator_concepts:
      +column_types:
        higher_is_better: boolean

models:
  afripulse:
    staging:
      +schema: staging
      +materialized: view        # cheap: always reflects the latest raw data
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table       # fast for Tableau
      +grants:
        select: ["afripulse_reader"]
    reporting:
      +schema: reporting
      +materialized: table       # flat, dashboard-ready extracts for Tableau Public
      +grants:
        select: ["afripulse_reader"]
