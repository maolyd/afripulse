version: 2

# SYNTHETIC data: generated by afripulse.synthetic, calibrated to real statistics.

models:
  - name: stg_synthetic__customers
    description: SYNTHETIC customers.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('african_countries')
                field: iso3
      - name: is_synthetic
        data_tests:
          - accepted_values:
              arguments:
                values: [true]

  - name: stg_synthetic__merchants
    description: SYNTHETIC merchants.
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]

  - name: stg_synthetic__retail_transactions
    description: SYNTHETIC retail purchases.
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_synthetic__customers')
                field: customer_id
      - name: merchant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_synthetic__merchants')
                field: merchant_id
      - name: payment_method_code
        data_tests:
          - relationships:
              arguments:
                to: ref('payment_methods')
                field: payment_method_code
      - name: amount_usd
        data_tests: [not_null, positive]

  - name: stg_synthetic__mobile_money_transactions
    description: SYNTHETIC mobile money wallet transactions.
    columns:
      - name: mm_txn_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_synthetic__customers')
                field: customer_id
      - name: txn_type
        data_tests:
          - accepted_values:
              arguments:
                values: [p2p_transfer, cash_in, cash_out, airtime_purchase, bill_payment, merchant_payment]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, failed]

  - name: stg_synthetic__loyalty_events
    description: SYNTHETIC loyalty points earned and redeemed.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: balance_after
        description: Never negative (generator invariant).
        data_tests:
          - between:
              arguments: {min_value: 0, max_value: 100000000}
