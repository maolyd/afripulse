# ============================================================
# AfriPulse project configuration
# One file defines: package metadata, dependencies, and tool settings.
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afripulse"
version = "0.1.0"
description = "African Digital Economy and Consumer Intelligence Data Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "maolyd" }]

# Runtime dependencies: what the pipeline needs to run.
dependencies = [
    "requests>=2.32,<3",          # HTTP calls to APIs (World Bank, IMF)
    "tenacity>=8.5,<10",          # automatic retries with backoff
    "pandas>=2.2,<3",             # tabular data processing
    "openpyxl>=3.1,<4",           # reading Excel files (ITU, Findex)
    "SQLAlchemy>=2.0,<2.1",       # database toolkit
    "psycopg[binary]>=3.2,<4",    # PostgreSQL driver
    "python-dotenv>=1.0,<2",      # load secrets from .env
    "pydantic>=2.7,<3",           # data validation
    "pydantic-settings>=2.3,<3",  # typed configuration from env vars
    "PyYAML>=6.0,<7",             # read config/*.yml files
]

# Development-only dependencies: testing and code quality.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# Tell setuptools our code lives in src/
[tool.setuptools.packages.find]
where = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ---------- ruff (linter + formatter) ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]